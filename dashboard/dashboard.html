<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الكتيبة 20 - لوحة القيادة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0f07;--surface:rgba(255,255,255,0.04);--surface-hover:rgba(255,255,255,0.08);--border:rgba(255,255,255,0.06);--glass:rgba(10,15,7,0.7);--glass-border:rgba(255,255,255,0.08);--gold:#d4a843;--gold-light:#f0d68a;--gold-dark:#a67c2e;--text:#e8e0d0;--text-muted:rgba(232,224,208,0.5);--radius:20px;--shadow:0 8px 32px rgba(0,0,0,0.4);--color-1:#ff6b6b;--color-2:#4ecdc4;--color-3:#45b7d1;--color-4:#f9ca24;--color-5:#a29bfe}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;direction:rtl}
body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 20% 50%,rgba(212,168,67,0.03) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(78,205,196,0.03) 0%,transparent 50%),radial-gradient(ellipse at 50% 80%,rgba(162,155,254,0.02) 0%,transparent 50%);pointer-events:none;z-index:0}

/* Login */
#loginScreen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);opacity:0;transition:opacity .6s;pointer-events:none}
#loginScreen.show{opacity:1;pointer-events:all}
.login-card{width:400px;max-width:92vw;padding:48px 36px;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--glass-border);border-radius:var(--radius);box-shadow:var(--shadow);text-align:center}
.login-card .logo{font-size:48px;margin-bottom:12px}
.login-card h1{font-size:22px;font-weight:800;color:var(--gold);margin-bottom:4px}
.login-card p{font-size:13px;color:var(--text-muted);margin-bottom:28px}
.login-card input{width:100%;padding:14px 18px;margin-bottom:14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;font-family:inherit;outline:none;transition:border-color .3s}
.login-card input:focus{border-color:var(--gold)}
.login-card input::placeholder{color:var(--text-muted)}
.login-card button{width:100%;padding:14px;background:linear-gradient(135deg,var(--gold-dark),var(--gold),var(--gold-light));border:none;border-radius:12px;color:var(--bg);font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:transform .2s,box-shadow .2s}
.login-card button:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(212,168,67,0.3)}
.login-card .error{color:#ff6b6b;font-size:13px;margin-top:10px;display:none}

/* App */
.app{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:20px 24px;opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s}
.app.loaded{opacity:1;transform:translateY(0)}
.app.hidden{display:none}

/* Header */
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:16px}
.header-left{display:flex;align-items:center;gap:12px}
.header-left .badge{background:var(--gold);color:var(--bg);padding:4px 14px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.5px}
.header-left h1{font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--gold-light),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-right{display:flex;align-items:center;gap:14px}
.header-right .greeting{font-size:14px;color:var(--text-muted)}
.header-right .greeting strong{color:var(--text)}
.header-right .logout-btn{padding:8px 18px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text-muted);font-size:13px;font-family:inherit;cursor:pointer;transition:all .3s}
.header-right .logout-btn:hover{background:var(--surface-hover);color:#ff6b6b;border-color:#ff6b6b44}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.stat-card{position:relative;padding:20px 22px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:transform .3s,box-shadow .3s}
.stat-card:hover{transform:translateY(-4px);box-shadow:0 12px 48px rgba(0,0,0,0.5)}
.stat-card .glow{position:absolute;top:-50%;right:-50%;width:200%;height:200%;pointer-events:none;border-radius:50%}
.stat-card:nth-child(1) .glow{background:radial-gradient(circle,rgba(212,168,67,0.08) 0%,transparent 60%)}
.stat-card:nth-child(2) .glow{background:radial-gradient(circle,rgba(78,205,196,0.08) 0%,transparent 60%)}
.stat-card:nth-child(3) .glow{background:radial-gradient(circle,rgba(255,107,107,0.08) 0%,transparent 60%)}
.stat-card:nth-child(4) .glow{background:radial-gradient(circle,rgba(162,155,254,0.08) 0%,transparent 60%)}
.stat-card .stat-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.stat-card .stat-icon{font-size:24px;opacity:.6}
.stat-card .stat-trend{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;display:flex;align-items:center;gap:3px}
.trend-up{background:rgba(78,205,196,0.15);color:#4ecdc4}
.trend-down{background:rgba(255,107,107,0.15);color:#ff6b6b}
.stat-card .stat-label{font-size:11px;color:var(--text-muted);font-weight:500;margin-bottom:2px}
.stat-card .stat-value{font-size:30px;font-weight:800;color:var(--text);line-height:1.1;direction:ltr;text-align:right}
.stat-card .stat-sub{font-size:11px;color:var(--text-muted);margin-top:4px}

/* Charts Grid */
.charts-grid{display:grid;gap:16px;margin-bottom:24px}
.charts-main{grid-template-columns:1fr}
.charts-with-side{grid-template-columns:2fr 1fr}
@media(max-width:900px){.charts-with-side{grid-template-columns:1fr}}

.chart-card{padding:20px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:var(--radius);box-shadow:var(--shadow)}
.chart-card .chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.chart-card .chart-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.chart-card .chart-title .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.chart-card .chart-subtitle{font-size:11px;color:var(--text-muted);font-weight:400}
.chart-card .chart-wrap{position:relative;width:100%;height:300px}
.chart-card .chart-wrap canvas{width:100%!important;height:100%!important}

/* Custom Legend */
.custom-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-muted);cursor:pointer;padding:4px 10px;border-radius:8px;transition:all .3s;background:var(--surface)}
.legend-item:hover{background:var(--surface-hover)}
.legend-item .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend-item .val{color:var(--text);font-weight:700;margin-right:4px}

/* Section cards (category performance) */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:24px}
.cat-card{padding:16px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:16px;text-align:center;transition:all .3s}
.cat-card:hover{transform:translateY(-3px);box-shadow:0 8px 32px rgba(0,0,0,0.4)}
.cat-card .cat-icon{font-size:22px;margin-bottom:6px}
.cat-card .cat-name{font-size:13px;font-weight:700;margin-bottom:4px}
.cat-card .cat-value{font-size:24px;font-weight:800;line-height:1}
.cat-card .cat-change{font-size:11px;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:4px}

/* Bottom row */
.bottom-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:768px){.bottom-row{grid-template-columns:1fr}}

/* Notifications */
.notif-list{max-height:360px;overflow-y:auto}
.notif-list::-webkit-scrollbar{width:4px}
.notif-list::-webkit-scrollbar-track{background:transparent}
.notif-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.notif-item{padding:12px;border-bottom:1px solid var(--border);transition:all .2s;border-radius:8px;margin-bottom:2px;cursor:pointer}
.notif-item:hover{background:var(--surface);transform:translateX(-2px)}
.notif-item:last-child{border-bottom:none}
.notif-item .notif-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.notif-item .notif-type{font-size:9px;padding:1px 8px;border-radius:10px;font-weight:700}
.notif-type.evaluation{background:rgba(69,183,209,0.2);color:#45b7d1}
.notif-type.distinction{background:rgba(212,168,67,0.2);color:var(--gold)}
.notif-type.punishment{background:rgba(255,107,107,0.2);color:#ff6b6b}
.notif-type.announcement{background:rgba(78,205,196,0.2);color:#4ecdc4}
.notif-item .notif-msg{font-size:13px;font-weight:500}
.notif-item .notif-time{font-size:11px;color:var(--text-muted)}
.notif-item.unread{background:rgba(212,168,67,0.04);border-right:2px solid var(--gold)}
.notif-empty{color:var(--text-muted);font-size:13px;text-align:center;padding:40px 0}

/* Mini stat cards row */
.mini-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.mini-stat{padding:12px 14px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:14px;display:flex;align-items:center;gap:10px;transition:all .3s}
.mini-stat:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.mini-stat .ms-icon{font-size:20px;opacity:.7}
.mini-stat .ms-info{flex:1}
.mini-stat .ms-label{font-size:10px;color:var(--text-muted)}
.mini-stat .ms-value{font-size:16px;font-weight:700}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}
.anim-fade{animation:fadeUp .6s ease both}
.anim-fade-1{animation-delay:.05s}.anim-fade-2{animation-delay:.1s}.anim-fade-3{animation-delay:.15s}.anim-fade-4{animation-delay:.2s}
.anim-fade-5{animation-delay:.25s}.anim-fade-6{animation-delay:.3s}.anim-fade-7{animation-delay:.35s}.anim-fade-8{animation-delay:.4s}

/* Loading */
.loading{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px;opacity:0;transition:opacity .5s}
.loading.show{opacity:1}
.loading .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--text-muted);font-size:14px}

/* Mobile */
@media(max-width:600px){
  .app{padding:12px}
  .header{flex-direction:column;align-items:flex-start}
  .stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{padding:14px 16px}
  .stat-card .stat-value{font-size:22px}
  .chart-card .chart-wrap{height:220px}
  .cat-grid{grid-template-columns:repeat(2,1fr)}
  .login-card{padding:32px 24px}
  .mini-stats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div id="loadingScreen" class="loading show"><div class="spinner"></div><p>جاري التحميل...</p></div>

<div id="loginScreen">
  <div class="login-card">
    <div class="logo">🎖️</div>
    <h1>الكتيبة 20</h1>
    <p>نظام تقييم الأداء - لوحة القيادة</p>
    <input type="text" id="loginUser" placeholder="اسم المستخدم" autocomplete="username">
    <input type="password" id="loginPass" placeholder="كلمة المرور" autocomplete="current-password">
    <div class="error" id="loginError"></div>
    <button id="loginBtn">تسجيل الدخول</button>
  </div>
</div>

<div class="app" id="app">
  <div class="header">
    <div class="header-left">
      <div class="badge">كتيبة 20</div>
      <h1>لوحة القيادة</h1>
    </div>
    <div class="header-right">
      <div class="greeting">مرحباً، <strong id="userName">...</strong></div>
      <button class="logout-btn" id="logoutBtn">تسجيل خروج</button>
    </div>
  </div>

  <!-- Main Stats -->
  <div class="stats" id="statsRow"></div>

  <!-- Category Performance Cards -->
  <div class="cat-grid" id="catRow"></div>

  <!-- Main Chart (Line/Area with all categories) -->
  <div class="charts-grid charts-main">
    <div class="chart-card anim-fade anim-fade-3">
      <div class="chart-header">
        <div class="chart-title"><span class="dot" style="background:var(--gold)"></span> تطور الأداء <span class="chart-subtitle">حسب الفئة</span></div>
      </div>
      <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
      <div class="custom-legend" id="legendMain"></div>
    </div>
  </div>

  <!-- Bottom charts -->
  <div class="bottom-row">
    <div class="chart-card anim-fade anim-fade-4">
      <div class="chart-header">
        <div class="chart-title"><span class="dot" style="background:#4ecdc4"></span> مقارنة الفئات <span class="chart-subtitle">آخر تقييم</span></div>
      </div>
      <div class="chart-wrap" style="height:240px"><canvas id="compareChart"></canvas></div>
    </div>
    <div class="chart-card anim-fade anim-fade-5">
      <div class="chart-header">
        <div class="chart-title"><span class="dot" style="background:#45b7d1"></span> آخر الإشعارات</div>
      </div>
      <div class="notif-list" id="notifList"><div class="notif-empty">لا توجد إشعارات</div></div>
    </div>
  </div>

  <!-- Mini stats at bottom -->
  <div class="mini-stats" id="miniStats"></div>
</div>

<script>
// Chart.js datalabels plugin registration
Chart.register(ChartDataLabels);

const API = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
  ? 'http://localhost:3001/api' : '/api';
let TOKEN = localStorage.getItem('b20_token') || '';
let USER = null;
let chartInstances = {};

function $(id) { return document.getElementById(id); }

/* --- Login --- */
$('loginBtn').addEventListener('click', doLogin);
$('loginPass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

async function doLogin() {
  const u = $('loginUser').value.trim(), p = $('loginPass').value;
  if (!u || !p) { showError('يرجى إدخال اسم المستخدم وكلمة المرور'); return; }
  try {
    const res = await fetch(`${API}/auth/login`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:u,password:p}) });
    if (!res.ok) { const e = await res.json().catch(()=>({})); showError(e.error||'خطأ في تسجيل الدخول'); return; }
    const data = await res.json();
    TOKEN = data.token; USER = data.user;
    localStorage.setItem('b20_token', TOKEN);
    $('loginScreen').classList.remove('show');
    initDashboard();
  } catch(e) { showError('تعذر الاتصال بالخادم'); }
}

function showError(msg) { const el=$('loginError'); el.textContent=msg; el.style.display='block'; setTimeout(()=>el.style.display='none',4000); }

$('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('b20_token'); TOKEN=''; USER=null;
  Object.values(chartInstances).forEach(c => { if(c) try{c.destroy()}catch(e){} });
  $('app').classList.add('hidden'); $('loginScreen').classList.add('show');
});

/* --- API helper --- */
async function api(path, opts={}) {
  const res = await fetch(`${API}${path}`, { ...opts, headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${TOKEN}`, ...opts.headers } });
  if (!res.ok) {
    if(res.status===401) { localStorage.removeItem('b20_token'); TOKEN=''; $('app').classList.add('hidden'); $('loginScreen').classList.add('show'); }
    const e = await res.json().catch(()=>({})); throw new Error(e.error||`HTTP ${res.status}`);
  }
  return res.json();
}

/* --- Animate counter --- */
function animateCounter(el, target, decimals=0) {
  if (!el) return;
  const dur = 1200, start = performance.now();
  function tick(now) {
    const t = Math.min((now-start)/dur, 1);
    const eased = 1 - Math.pow(1-t, 3);
    el.textContent = (eased * target).toFixed(decimals);
    if (t<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* --- Init --- */
async function initDashboard() {
  $('loadingScreen').classList.add('show');
  $('app').classList.add('hidden');
  try {
    if (!USER) {
      try { USER = await api('/auth/me'); } catch(e) { USER = { name:'قائد', role:'commander' }; }
    }
    $('userName').textContent = USER?.name || 'قائد';
    await loadDashboard();
    $('loadingScreen').classList.remove('show');
    $('app').classList.remove('hidden');
    setTimeout(() => $('app').classList.add('loaded'), 50);
  } catch(e) { console.error(e); $('loadingScreen').classList.remove('show'); }
}

async function loadDashboard() {
  const [stats, notifs] = await Promise.all([
    api('/results/stats').catch(()=>null),
    api('/notifications').catch(()=>[])
  ]);
  renderStats(stats);
  renderCategories(stats);
  renderMainChart();
  renderCompareChart();
  renderNotifs(notifs||[]);
  renderMiniStats(stats);
}

/* --- Chart Data (user-specified) --- */
const CHART_DATA = {
  labels: ['04-03', '05-27', '06-16', '06-19'],
  datasets: [
    { label: 'تعليم', data: [65, 72, 80, 78], color: '#ff6b6b', bg: 'rgba(255,107,107,0.25)' },
    { label: 'انضباط', data: [70, 68, 75, 82], color: '#4ecdc4', bg: 'rgba(78,205,196,0.25)' },
    { label: 'رقابة', data: [55, 60, 58, 65], color: '#45b7d1', bg: 'rgba(69,183,209,0.25)' },
    { label: 'إيقاف', data: [40, 45, 50, 55], color: '#f9ca24', bg: 'rgba(249,202,36,0.25)' },
    { label: 'عام', data: [80, 85, 82, 88], color: '#a29bfe', bg: 'rgba(162,155,254,0.25)' },
  ]
};
const CAT_ICONS = { 'تعليم':'📚', 'انضباط':'⚖️', 'رقابة':'👁️', 'إيقاف':'⛔', 'عام':'📋' };

/* --- Stats --- */
function renderStats(s) {
  const el = $('statsRow');
  const items = [
    { icon:'👤', label:'إجمالي الأفراد', val:s?.totalSoldiers||0, trend:'up', trendLabel:`${s?.passRate||0}%`, sub:`${s?.totalResults||0} تقييم` },
    { icon:'📊', label:'متوسط الدرجات', val:Number(s?.avgScore||0).toFixed(1), trend:Number(s?.avgScore||0)>=70?'up':'down', trendLabel:Number(s?.avgScore||0)>=70?'ممتاز':'مقبول', sub:'جميع الفئات' },
    { icon:'🥇', label:'أفضل فئة', val:'عام', trend:'up', trendLabel:'⬆', sub:`${CHART_DATA.datasets[4].data[3]} نقطة` },
    { icon:'📉', label:'الأدنى', val:'إيقاف', trend:'up', trendLabel:'⬆', sub:`${CHART_DATA.datasets[3].data[3]} نقطة` },
  ];
  el.innerHTML = items.map((x,i) => `
    <div class="stat-card anim-fade anim-fade-${i+1}">
      <div class="glow"></div>
      <div class="stat-top">
        <div class="stat-icon">${x.icon}</div>
        <div class="stat-trend trend-${x.trend}">${x.trendLabel}</div>
      </div>
      <div class="stat-label">${x.label}</div>
      <div class="stat-value" data-count="${x.val}">0</div>
      <div class="stat-sub">${x.sub||''}</div>
    </div>
  `).join('');
  requestAnimationFrame(() => {
    el.querySelectorAll('.stat-value').forEach((el2,i) => {
      const target = parseFloat(items[i].val);
      const dec = Number.isInteger(target) ? 0 : 1;
      setTimeout(() => animateCounter(el2, target, Math.min(dec,1)), 150*i);
    });
  });
}

/* --- Category Cards --- */
function renderCategories(stats) {
  const el = $('catRow');
  el.innerHTML = CHART_DATA.datasets.map((d, i) => {
    const vals = d.data;
    const first = vals[0], last = vals[vals.length-1];
    const change = last - first;
    const changeStr = (change >= 0 ? '+' : '') + change;
    const up = change >= 0;
    return `<div class="cat-card anim-fade anim-fade-${i+1}">
      <div class="cat-icon">${CAT_ICONS[d.label]||'📊'}</div>
      <div class="cat-name" style="color:${d.color}">${d.label}</div>
      <div class="cat-value" style="color:${d.color}">${last}</div>
      <div class="cat-change" style="color:${up?'#4ecdc4':'#ff6b6b'}">${up?'⬆':'⬇'} ${changeStr}</div>
    </div>`;
  }).join('');
}

/* --- Main Chart (Smooth Line with Gradient Fills) --- */
function renderMainChart() {
  const ctx = $('mainChart').getContext('2d');
  const datasets = CHART_DATA.datasets.map(d => {
    const grad = ctx.createLinearGradient(0,0,0,300);
    grad.addColorStop(0, d.bg);
    grad.addColorStop(1, 'rgba(10,15,7,0.01)');
    return {
      label: d.label,
      data: d.data,
      borderColor: d.color,
      backgroundColor: grad,
      fill: true,
      tension: 0.4,
      pointBackgroundColor: d.color,
      pointBorderColor: '#0a0f07',
      pointBorderWidth: 2,
      pointRadius: 5,
      pointHoverRadius: 8,
      borderWidth: 3,
      borderCapStyle: 'round',
    };
  });
  chartInstances.main = new Chart(ctx, {
    type: 'line',
    data: { labels: CHART_DATA.labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(10,15,7,0.92)', titleFont: { family: 'Tajawal', size: 12 },
          bodyFont: { family: 'Tajawal', size: 13 }, cornerRadius: 10, padding: 14,
          bodySpacing: 4, borderColor: 'rgba(255,255,255,0.06)', borderWidth: 1,
          callbacks: {
            title: items => items[0].label,
            label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y}`,
          }
        },
        datalabels: {
          color: 'rgba(232,224,208,0.7)', font: { family: 'Tajawal', size: 11, weight: '700' },
          anchor: 'end', align: 'end', offset: 2,
          display: ctx => ctx.dataIndex === ctx.dataset.data.length - 1,
        }
      },
      scales: {
        y: { beginAtZero: true, max: 100, grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: 'rgba(232,224,208,0.4)', font: { family: 'Tajawal', size: 11 } } },
        x: { grid: { display: false }, ticks: { color: 'rgba(232,224,208,0.5)', font: { family: 'Tajawal', size: 11 } } }
      },
      animation: { duration: 1800, easing: 'easeOutQuart' },
      elements: { point: { hoverBorderWidth: 3 } }
    },
    plugins: [ChartDataLabels]
  });
  // Build custom legend
  const leg = $('legendMain');
  const lastIdx = CHART_DATA.labels.length - 1;
  leg.innerHTML = CHART_DATA.datasets.map(d =>
    `<div class="legend-item" onclick="toggleDataset('main', '${d.label}')">
      <span class="dot" style="background:${d.color}"></span>
      ${d.label}
      <span class="val">${d.data[lastIdx]}</span>
    </div>`
  ).join('');
}

function toggleDataset(chartId, label) {
  const chart = chartInstances[chartId];
  if (!chart) return;
  const idx = chart.data.datasets.findIndex(d => d.label === label);
  if (idx === -1) return;
  const meta = chart.getDatasetMeta(idx);
  meta.hidden = !meta.hidden;
  chart.update();
}

/* --- Compare Chart (Bar) --- */
function renderCompareChart() {
  const lastIdx = CHART_DATA.labels.length - 1;
  const labels = CHART_DATA.datasets.map(d => d.label);
  const vals = CHART_DATA.datasets.map(d => d.data[lastIdx]);
  const colors = CHART_DATA.datasets.map(d => d.color);
  const ctx = $('compareChart').getContext('2d');
  chartInstances.compare = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: vals,
        backgroundColor: colors.map(c => c + 'cc'),
        borderColor: colors,
        borderWidth: 2,
        borderRadius: 8,
        barPercentage: 0.6,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, indexAxis: 'y',
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(10,15,7,0.92)', titleFont: { family: 'Tajawal' },
          bodyFont: { family: 'Tajawal' }, cornerRadius: 10, padding: 12,
          callbacks: { label: ctx => `${ctx.parsed.x} نقطة` }
        },
        datalabels: {
          anchor: 'end', align: 'end', color: 'rgba(232,224,208,0.6)',
          font: { family: 'Tajawal', size: 12, weight: '700' },
          formatter: v => v + '',
        }
      },
      scales: {
        x: { beginAtZero: true, max: 100, grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: 'rgba(232,224,208,0.4)', font: { family: 'Tajawal', size: 10 } } },
        y: { grid: { display: false }, ticks: { color: 'rgba(232,224,208,0.6)', font: { family: 'Tajawal', size: 12 } } }
      },
      animation: { duration: 1000, easing: 'easeOutQuart' }
    },
    plugins: [ChartDataLabels]
  });
}

/* --- Mini Stats --- */
function renderMiniStats(s) {
  const el = $('miniStats');
  const items = [
    { icon:'🏋️', label:'اللياقة', val:Number(s?.avgFitness||0).toFixed(1) },
    { icon:'🎯', label:'التخصص', val:Number(s?.avgSpecialty||0).toFixed(1) },
    { icon:'⚖️', label:'الانضباط', val:Number(s?.avgDiscipline||0).toFixed(1) },
    { icon:'📈', label:'اجتياز', val:`${s?.passRate||0}%` },
    { icon:'🏆', label:'ممتاز', val:s?.distribution?.excellent||0 },
    { icon:'📊', label:'تقييمات', val:s?.totalResults||0 },
  ];
  el.innerHTML = items.map(x =>
    `<div class="mini-stat"><div class="ms-icon">${x.icon}</div><div class="ms-info"><div class="ms-label">${x.label}</div><div class="ms-value">${x.val}</div></div></div>`
  ).join('');
}

/* --- Notifications --- */
function renderNotifs(notifs) {
  const el = $('notifList');
  if (!notifs || !notifs.length) { el.innerHTML='<div class="notif-empty">لا توجد إشعارات</div>'; return; }
  const recent = notifs.slice(0,15);
  el.innerHTML = recent.map(n => {
    const type = n.type || 'evaluation';
    const time = timeAgo(n.created_at);
    const msg = n.message || n.title || '';
    return `<div class="notif-item ${n.is_read?'':'unread'}" onclick="handleNotifClick('${n.id}','${type}','${n.evaluated_id||''}','${n.evaluator_id||''}')">
      <div class="notif-top"><span class="notif-type ${type}">${typeNames[type]||type}</span><span class="notif-time">${time}</span></div>
      <div class="notif-msg">${escapeHtml(msg)}</div>
    </div>`;
  }).join('');
}

const typeNames = { evaluation:'تقييم', distinction:'تمييز', punishment:'عقاب', announcement:'إعلان' };

function handleNotifClick(id, type, evaluatedId, evaluatorId) {
  // Deep-link: open in new window with the relevant detail page
  let url = '/notifications';
  if (type === 'evaluation' && evaluatedId) url = `/soldiers/${evaluatedId}`;
  else if (type === 'distinction' && evaluatedId) url = `/soldiers/${evaluatedId}`;
  else if (type === 'punishment' && evaluatedId) url = `/soldiers/${evaluatedId}`;
  else if (type === 'announcement') url = '/';
  window.open(url, '_blank');
}

function timeAgo(d) {
  const diff = Date.now() - new Date(d).getTime();
  const mins = Math.floor(diff/60000);
  if (mins<1) return 'الآن';
  if (mins<60) return `منذ ${mins} د`;
  const hrs = Math.floor(mins/60);
  if (hrs<24) return `منذ ${hrs} س`;
  const days = Math.floor(hrs/24);
  if (days<7) return `منذ ${days} ي`;
  return new Date(d).toLocaleDateString('ar-EG');
}
function escapeHtml(t){const d=document.createElement('div');d.textContent=t||'';return d.innerHTML;}

/* --- Auto login check --- */
(async function() {
  if (TOKEN) {
    try {
      USER = await api('/auth/me');
      $('loginScreen').classList.remove('show');
      await initDashboard();
    } catch(e) {
      localStorage.removeItem('b20_token'); TOKEN='';
      $('loadingScreen').classList.remove('show');
      $('loginScreen').classList.add('show');
    }
  } else {
    $('loadingScreen').classList.remove('show');
    $('loginScreen').classList.add('show');
  }
})();

/* Handle resize */
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    Object.values(chartInstances).forEach(c => { if (c && c.resize) try{c.resize()}catch(e){} });
  }, 200);
});
</script>
